          Value: !Ref AWS::StackName
        - Key: Module
          Value: Lambda

  MemoryInitializerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-memory-initializer"
      Description: "Initializes AgentCore Memory with default entries after memory creation"
      Handler: index.handler
      Role: !GetAtt CustomResourceRole.Arn
      Runtime: python3.9
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          import logging
          import time
          from datetime import datetime

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info('Received event: %s', json.dumps(event))
              
              try:
                  if event['RequestType'] == 'Delete':
                      # No cleanup needed for memory entries
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  
                  memory_id = event['ResourceProperties']['MemoryId']
                  region = event['ResourceProperties'].get('Region', 'us-west-2')
                  timestamp = datetime.utcnow().isoformat() + 'Z'

                  logger.info(f"Initializing memory entries for Memory ID: {memory_id}")

                  activity_preferences = {
                      "good_weather": ["hiking", "beach volleyball", "outdoor picnic", "farmers market", "gardening", "photography", "bird watching"],
                      "ok_weather": ["walking tours", "outdoor dining", "park visits", "museums"],
                      "poor_weather": ["indoor museums", "shopping", "restaurants", "movies"]
                  }

                  # Convert the dictionary to a JSON string for storage in the blob
                  activity_preferences_json = json.dumps(activity_preferences)

                  # Initialize the bedrock-agentcore client
                  client = boto3.client('bedrock-agentcore', region_name=region)
                  
                  response = client.create_event(
                      memoryId=memory_id,
                      actorId="user123",
                      sessionId="session456",
                      eventTimestamp=timestamp,
                      payload=[
                          {
                              'blob': activity_preferences_json,
                          }
                      ]
                  )
                  logger.info(f"Successfully created memory event: {response}")
                  
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'MemoryId': memory_id,
                      'Status': 'INITIALIZED'
                  })
                  
              except Exception as e:
                  logger.error('Error initializing memory: %s', str(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-memory-initializer"
        - Key: StackName
          Value: !Ref AWS::StackName
        - Key: Module
          Value: Lambda

  # ========================================================================
  # CODEBUILD MODULE - Container Image Building
  # ========================================================================

  # Specialist Agent Build Project (build first as it's independent)
  Agent2ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-${Agent2Name}-build"
      Description: !Sub "Build ${Agent2Name} Docker image for ${AWS::StackName}"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: IMAGE_REPO_NAME
            Value: !Ref ECRRepositoryAgent2
          - Name: IMAGE_TAG
            Value: !Ref ImageTag
          - Name: STACK_NAME
            Value: !Ref AWS::StackName
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
            build:
              commands:
                - echo Build started on `date`
                - echo Building the Docker image for agent2 ARM64...

                # Download agent files from S3
                - |
                  echo "Downloading agent code from S3..."
                  aws s3 cp s3://${STACK_NAME}-cf-templates-${AWS_ACCOUNT_ID}/agent-code/ ./ --recursive --region ${AWS_DEFAULT_REGION}
                  echo "Agent code files downloaded:"
                  ls -la *.py *.txt Dockerfile* 2>/dev/null || echo "Some files may be missing"

                # Create agent2-specific Dockerfile
                - |
                  cat > Dockerfile << 'EOF'
                  FROM public.ecr.aws/docker/library/python:3.11-slim
                  WORKDIR /app

                  COPY requirements.txt requirements.txt
                  RUN pip install -r requirements.txt
                  RUN pip install aws-opentelemetry-distro>=0.10.1

                  # Create non-root user
                  RUN useradd -m -u 1000 bedrock_agentcore
                  USER bedrock_agentcore

                  EXPOSE 8080
                  EXPOSE 8000

                  COPY . .

                  CMD ["opentelemetry-instrument", "python", "-m", "specialist_agent"]
                  EOF

                # Build the image
                - echo Building ARM64 image...
                - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
                - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

            post_build:
              commands:
                - echo Build completed on `date`
                - echo Pushing the Docker image...
                - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
                - echo ARM64 Docker image pushed successfully

      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-${Agent2Name}-build"
        - Key: StackName
          Value: !Ref AWS::StackName
        - Key: Module
          Value: CodeBuild

